# Renders AlbumStack on GitHub-hosted Linux runners.
#
# Meant for a PUBLIC repository: Actions usage is free there (no minutes or
# artifact-storage quota), and each job gets a 4 vCPU / 16 GB runner. A private
# repo would burn paid minutes and only get 2 vCPU / 8 GB per job.
#
# The mp4 is rendered by a matrix of jobs, one runner per chunk of the timeline
# (see scripts/render-plan.mjs), and a final job concatenates them.
#
# Measured on this composition (797 frames of 1080p60, on a Free plan account):
#
#   single runner            ~30 min
#   8 chunks                  9.8 min   gated by the heaviest chunk (8.2 min)
#   10 chunks (this default)  7.6 min   heaviest chunk 6.8 min
#   20 chunks                 9.7 min   no gain — see the concurrency note below
#
# Two things set the number:
#
#   * The account gets **6 concurrent jobs**, not the 20 the Free plan docs
#     advertise (measured: concurrency climbs to 6 and then a new job only
#     starts when one finishes). So the floor is total work / 6, and every
#     extra chunk adds its own setup (~0.5 min) to that total.
#
#   * Frames cost wildly different amounts. Frames 0-439 (cards flying in,
#     decoding video, hero clip, camera moves) are 93% of the render work;
#     frames 440+ (the Token outro — black frames with a word on them) are 7%.
#     Since Remotion requires equal frame counts per chunk, the heaviest chunk
#     sets the floor. ~10 chunks is where the heaviest chunk stops being the
#     bottleneck and the per-job setup starts being one.
#
# Manual only — a render is minutes of CPU, not something to fire on every push.
name: render

on:
  workflow_dispatch:
    inputs:
      target:
        description: '渲染目标'
        type: choice
        options:
          - mp4
          - alpha
          - both
        default: mp4
      chunks:
        description: '分块数（1 = 不分块；实测最优是 10，见文件顶部注释）'
        required: false
        default: '10'
      render_concurrency:
        description: '每台 runner 内部的并发（数字如 2，或百分比如 50%；留空 = Remotion 自动）'
        required: false
        default: '50%'
      retention_days:
        description: 'artifact 保留天数 (1-90)'
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  plan:
    name: Plan chunks
    if: inputs.target == 'mp4' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      frames_per_chunk: ${{ steps.plan.outputs.frames_per_chunk }}
      duration_in_frames: ${{ steps.plan.outputs.duration_in_frames }}
      fps: ${{ steps.plan.outputs.fps }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --loglevel=error

      # Remotion downloads Chrome Headless Shell (~150 MB) into
      # node_modules/.remotion on first use. Cache it or pay for the download
      # on every run of every job.
      - name: Cache Chrome Headless Shell
        uses: actions/cache@v6
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx remotion browser ensure

      - name: Plan
        id: plan
        run: node scripts/render-plan.mjs --chunks=${{ inputs.chunks }}

      - name: Show plan
        run: echo '${{ steps.plan.outputs.chunks }}' | jq -c '.[]'

  chunk:
    name: Chunk ${{ matrix.chunk.index }}
    needs: plan
    if: inputs.target == 'mp4' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      # One slow chunk should not cancel the others — the stitch job reports
      # what is missing.
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --loglevel=error

      - name: Cache Chrome Headless Shell
        uses: actions/cache@v6
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx remotion browser ensure

      # Chrome Headless Shell needs a handful of shared libraries
      # (https://www.remotion.dev/docs/miscellaneous/linux-dependencies). The
      # runner image ships Google Chrome, so they are normally already there —
      # only pay the ~70s apt round trip when one is actually missing.
      - name: Chrome shared libraries
        run: |
          BIN=$(find node_modules/.remotion -name chrome-headless-shell -type f | head -1)
          if ldd "$BIN" | grep -q 'not found'; then
            echo "missing libraries, installing:"
            ldd "$BIN" | grep 'not found' || true
            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
              libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
              libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
          else
            echo "all shared libraries present"
          fi

      - name: Render frames ${{ matrix.chunk.start }}-${{ matrix.chunk.end }}
        env:
          CHUNK_INDEX: ${{ matrix.chunk.index }}
          CHUNK_START: ${{ matrix.chunk.start }}
          CHUNK_END: ${{ matrix.chunk.end }}
          REMOTION_CONCURRENCY: ${{ inputs.render_concurrency }}
        run: node scripts/render-chunk.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: chunk-${{ matrix.chunk.index }}
          path: |
            out/chunk-${{ matrix.chunk.index }}.ts
            out/chunk-${{ matrix.chunk.index }}.aac
          retention-days: ${{ fromJSON(inputs.retention_days) }}
          if-no-files-found: error

  stitch:
    name: Stitch
    needs: [plan, chunk]
    if: inputs.target == 'mp4' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --loglevel=error

      - uses: actions/download-artifact@v7
        with:
          pattern: chunk-*
          path: out/chunks
          merge-multiple: true

      - name: Combine chunks
        env:
          CHUNKS_DIR: out/chunks
          FRAMES_PER_CHUNK: ${{ needs.plan.outputs.frames_per_chunk }}
          DURATION_IN_FRAMES: ${{ needs.plan.outputs.duration_in_frames }}
          FPS: ${{ needs.plan.outputs.fps }}
        run: node scripts/stitch.mjs

      - name: Report output
        if: always()
        run: |
          ls -lh out/ out/chunks/ || true
          if [ -f out/AlbumStack.mp4 ]; then
            npx remotion ffprobe out/AlbumStack.mp4
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: AlbumStack-mp4-${{ github.run_number }}
          path: out/AlbumStack.mp4
          retention-days: ${{ fromJSON(inputs.retention_days) }}
          if-no-files-found: error

  # The transparent ProRes 4444 master is not chunked: `combineChunks()` only
  # concatenates h264 without re-encoding, and re-encoding ProRes with an alpha
  # channel is not something to gamble the alpha on. It is also the output you
  # need least often, so it stays a plain single-runner render.
  alpha:
    name: Alpha (ProRes 4444)
    if: inputs.target == 'alpha' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # render.mjs re-muxes the result with ffmpeg to drop the AAC priming
      # samples; the Ubuntu runner image does not ship ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: npm ci --loglevel=error

      - name: Cache Chrome Headless Shell
        uses: actions/cache@v6
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx remotion browser ensure

      - name: Chrome shared libraries
        run: |
          BIN=$(find node_modules/.remotion -name chrome-headless-shell -type f | head -1)
          if ldd "$BIN" | grep -q 'not found'; then
            sudo apt-get install -y -qq \
              libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
              libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
              libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
          else
            echo "all shared libraries present"
          fi

      - name: Render alpha
        env:
          REMOTION_CONCURRENCY: ${{ inputs.render_concurrency }}
        run: node render.mjs out/AlbumStackAlpha.mov

      - name: Report output
        if: always()
        run: ls -lh out/AlbumStackAlpha.mov || true

      # ~330 MB for 13s: ProRes 4444 at 1080p60 is heavy.
      - uses: actions/upload-artifact@v7
        with:
          name: AlbumStack-alpha-${{ github.run_number }}
          path: out/AlbumStackAlpha.mov
          retention-days: ${{ fromJSON(inputs.retention_days) }}
          if-no-files-found: error
